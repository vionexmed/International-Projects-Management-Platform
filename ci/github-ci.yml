name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest

    # The integration suite talks to a real PostgreSQL, because the supplier
    # isolation guarantees are expressed as database queries — mocking them
    # would test the mock instead of the rules.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vionex
          POSTGRES_PASSWORD: vionex_ci
          POSTGRES_DB: vionex_projects_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vionex -d vionex_projects_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://vionex:vionex_ci@localhost:5432/vionex_projects_ci?schema=public
      # 32+ characters, CI-only, never used to serve real traffic.
      AUTH_SECRET: ci-only-secret-value-not-used-in-production-0000
      APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: ./.ci-storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `postinstall` runs `prisma generate`, so the client is ready after this.
      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
